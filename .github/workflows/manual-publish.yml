# REQUIRED: NPM_TOKEN secret configured in GitHub Settings > Secrets
# Setup: https://docs.npmjs.com/creating-and-viewing-access-tokens

name: Manual Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (major.minor.patch)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish Version ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Build package
        run: npm run build
      
      - name: Update version in package.json
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version
      
      - name: Publish to npm
        # NPM_TOKEN: Must be manually configured in repository secrets
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Commit version bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to ${{ github.event.inputs.version }}"
      
      - name: Create Git Tag
        run: |
          git tag -a v${{ github.event.inputs.version }} -m "Release version ${{ github.event.inputs.version }}"
          git push origin main
          git push origin v${{ github.event.inputs.version }}
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          body: |
            ## Version ${{ github.event.inputs.version }}
            
            Published to npm: https://www.npmjs.com/package/editium/v/${{ github.event.inputs.version }}
          draft: false
          prerelease: false
